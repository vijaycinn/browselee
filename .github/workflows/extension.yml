name: Extension

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - 'pnpm-lock.yaml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile=false

      - run: pnpm --filter @browselee/extension build

      - run: pnpm --filter @browselee/extension test --if-present

      - name: Zip distribution
        run: |
          cd extension/dist
          zip -r ../../browselee-extension-${{ github.sha }}.zip .
          cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: browselee-extension-${{ github.sha }}
          path: browselee-extension-${{ github.sha }}.zip
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./browselee-extension-${{ github.sha }}.zip
          asset_name: browselee-extension-${{ github.ref_name }}.zip
          asset_content_type: application/zip
